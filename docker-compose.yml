services:
  postgres:
    image: pgvector/pgvector:pg16 
    container_name: pg_dev
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ELearningPassword
      POSTGRES_DB: ELearningDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: